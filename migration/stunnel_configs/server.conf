; server.conf — Stage 1: TLS tunnel, default (classical) group negotiation
; Terminates TLS on 8443, hands off plaintext to the dummy backend on 9000.
;
; NOTE: `groups = X25519` was removed here -- this stunnel build (5.63,
; compiled against OpenSSL 3.0.2 headers) doesn't support that directive,
; even though it's dynamically running against our custom OpenSSL 3.5.8-dev
; at runtime. Not a config mistake -- the option genuinely isn't in this
; binary's table. We'll rebuild stunnel from source against our own
; OpenSSL/oqs-provider before Stage 2, since forcing the hybrid group is
; the whole point of that stage and can't be skipped there.

pid =
cert = /home/sahana/Migration-Orchestrator/migration/certs/server.crt
key  = /home/sahana/Migration-Orchestrator/migration/certs/server.key

foreground = yes
debug = 6
output = /home/sahana/Migration-Orchestrator/migration/stunnel_configs/server.log

[classical-test]
accept = 127.0.0.1:8443
connect = 127.0.0.1:9000
