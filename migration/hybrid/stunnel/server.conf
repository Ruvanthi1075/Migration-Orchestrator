; server.conf -- shared Hybrid (PQC) stunnel SERVER, controller side
; (guide QSMO_Implementation_Guide.docx §8.2/§8.3)
;
; TWO services in this one file / one process (the "chained" design):
;
;   [hybrid-controller]  accepts the switch-side Hybrid PQC connection
;                        (X25519MLKEM768, ML-DSA certs) on 0.0.0.0:16653,
;                        decrypts it, and hands PLAINTEXT OpenFlow to...
;   [legacy-rewrap]      ...127.0.0.1:6660, which re-wraps it in ordinary
;                        classical TLS (the Legacy ECDSA switch cert) and
;                        connects to OS-Ken's existing SSL listener on
;                        127.0.0.1:6653.
;
;   Hybrid switch --PQC TLS--> :16653 --plaintext--> :6660 --classical TLS--> :6653 OS-Ken
;
; WHY: osken-manager binds exactly ONE OpenFlow listener. With
; --ctl-privkey set it is SSL-only on 6653; --ofp-tcp-listen-port is
; silently ignored (confirmed live: only 6653 shows up in `ss -tlnp`,
; and --ofp-ssl-listen-port's default even resolves to None and
; crashes the bind). So a plaintext handoff straight to 6653 can never
; work, and OS-Ken cannot be given a second listener. Instead OS-Ken
; is left completely unchanged: it just sees another ordinary Legacy
; TLS client. This closes the old "backend-port collision" open item.
;
; TRADE-OFF (state it as a limitation in the write-up, guide §12): the
; PQC protection covers switch -> stunnel server. The last hop
; (127.0.0.1:6660 -> :6653) is loopback and classical, on the same VM.
; That is fine for a testbed; a production design would want a
; controller with a native PQC-capable listener instead.
;
; CONFIRMED (live test, 2026-09-20): the SYSTEM stunnel (5.63, running
; against a PQC-capable OpenSSL 3.5.8-dev) negotiates X25519MLKEM768
; via the `curve` directive -- no separate rebuilt binary is needed.
; hybrid_stunnel_bin in migrate_link.py defaults to "stunnel" (PATH).
;
; Cert material:
;   [hybrid-controller] uses migration/hybrid/certs/ (ML-DSA chain from
;       gen_hybrid_certs.sh).
;   [legacy-rewrap]     uses migration/certs/ (classical ECDSA chain from
;       gen_certs.sh). It presents the shared Legacy switch cert, which
;       OS-Ken already trusts via --ca-certs. OS-Ken identifies switches
;       by the DPID in the OpenFlow handshake, not by cert CN, so one
;       shared identity for every rewrapped switch is fine.
;   Never mix the two chains between the two services.
;
; Each service carries its OWN cert/key/CAfile/verify lines on purpose
; (nothing is inherited from the global section), so the two chains
; cannot leak into each other.
;
; PATHS BELOW ARE ABSOLUTE (stunnel is launched as a subprocess by
; migrate_link.py whose cwd is not this directory). If your repo lives
; somewhere other than /home/ruvan/Migration-Orchestrator/Migration-Orchestrator, replace
; that prefix everywhere in this file, e.g.:
;   sed -i 's#/home/ruvan/Migration-Orchestrator/Migration-Orchestrator#/your/real/path#g' server.conf
;
; The logs/ directory must exist before a MANUAL start:
;   mkdir -p migration/hybrid/stunnel/logs
; (migrate_link.py creates it itself when it launches the server.)

; ---- global options only ----
pid =
foreground = yes
debug = 6
output = /home/ruvan/Migration-Orchestrator/migration/hybrid/stunnel/logs/server.log

; ---------------------------------------------------------------
; Service 1: terminate the Hybrid PQC connection from each switch
; ---------------------------------------------------------------
[hybrid-controller]
; Must match migrate_link.py's HYBRID_SERVER_PORT (default 16653) --
; if you override hybrid_server_port on MigrationExecutor(...), update
; this line to match.
accept = 0.0.0.0:16653

; Plaintext loopback handoff to the [legacy-rewrap] service below.
; (This used to be 127.0.0.1:6653, which is OS-Ken's SSL-only port.)
connect = 127.0.0.1:6660

cert = /home/ruvan/Migration-Orchestrator/migration/hybrid/certs/controller-hybrid.cert
key  = /home/ruvan/Migration-Orchestrator/migration/hybrid/certs/controller-hybrid.key
CAfile = /home/ruvan/Migration-Orchestrator/migration/hybrid/certs/hybrid-ca.cert
; verifyChain (not verifyPeer): validates the peer's cert against the CA
; chain above. verifyPeer demands the exact leaf cert be present in a
; local repository -- confirmed by live testing to reject every valid
; Hybrid cert ("Certificate not found in local repository").
verifyChain = yes

; The point of Stage 1's dry run (guide §8.2): force the hybrid KEM
; group as the ONLY entry, so a successful handshake is itself proof
; this exact group was used -- there is no other group to silently
; fall back to. `curve` (not `groups`) is stunnel's real directive.
curve = X25519MLKEM768
sslVersion = TLSv1.3

; ---------------------------------------------------------------
; Service 2: re-wrap plaintext into classical TLS for OS-Ken
; ---------------------------------------------------------------
[legacy-rewrap]
client = yes
; Loopback ONLY -- this port speaks unauthenticated plaintext OpenFlow,
; so it must never be bound to 0.0.0.0.
accept  = 127.0.0.1:6660
connect = 127.0.0.1:6653

; Legacy (classical ECDSA) chain from gen_certs.sh -- NOT the hybrid one.
cert   = /home/ruvan/Migration-Orchestrator/migration/certs/switch.cert
key    = /home/ruvan/Migration-Orchestrator/migration/certs/switch.key
CAfile = /home/ruvan/Migration-Orchestrator/migration/certs/ca.cert
verifyChain = yes
; checkHost pins WHICH controller cert is trusted. Without it stunnel
; only warns ("Use checkHost or checkIP to restrict trusted
; certificates") and accepts ANY cert signed by the Legacy CA; older
; stunnel builds may refuse to start without it. gen_certs.sh issues
; the controller cert with CN=sdn-controller (no SAN), so match on
; that CN. Verified: a wrong name here is rejected with
; "certificate verify failed".
checkHost = sdn-controller
